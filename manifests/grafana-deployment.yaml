apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 13.1.1
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  # Recreate is REQUIRED now that grafana-storage is a ReadWriteOnce claim: under the
  # default RollingUpdate the new pod cannot mount the volume until the old one releases
  # it, and the old one is not terminated until the new one is Ready — a deadlock that
  # presents as a rollout stuck forever with the new pod Pending on FailedAttachVolume.
  # The cost is a few seconds of Grafana downtime per rollout, which is the right trade
  # against losing alert state on every restart.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: kube-prometheus
  template:
    metadata:
      annotations:
        # Bumped by hand when grafana-config.yaml changed (added [server] root_url).
        # Upstream mints this from jsonnet; functionally the value only has to CHANGE when
        # the ini changes, so `kubectl apply -f manifests/` rolls the pod — Grafana reads
        # grafana.ini once at startup and never re-reads the mounted Secret. This is now
        # plain md5 of the ini payload: python3 -c "import yaml,hashlib;
        # print(hashlib.md5(yaml.safe_load(open('manifests/grafana-config.yaml'))['stringData']['grafana.ini'].encode()).hexdigest())"
        checksum/grafana-config: 41f1a17880683e2abb6b393d7800b234
        checksum/grafana-dashboardproviders: e67a7f7e1db3c278d65db9ed24935a44
        # Bumped by hand when the Alertmanager datasource was added (2026-08-04); same
        # md5-of-payload scheme and reasoning as checksum/grafana-config above.
        checksum/grafana-datasources: 67771c3cd181bcceb7d4c912704ce2e2
      labels:
        app.kubernetes.io/component: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: kube-prometheus
        app.kubernetes.io/version: 13.1.1
    spec:
      automountServiceAccountToken: false
      containers:
      # Admin login, pinned. `grafana-storage` below is an emptyDir, so
      # Grafana's SQLite DB — and with it the admin password — is destroyed
      # on every pod restart. Grafana re-applies GF_SECURITY_ADMIN_USER /
      # GF_SECURITY_ADMIN_PASSWORD to the admin account on each startup, so
      # setting them here is what makes the login survive a restart, a
      # rollout and a full minikube rebuild.
      #
      # The `grafana-admin` Secret is NOT defined in this repo and is not in
      # git anywhere. Vault (kv/grafana/admin) is the source of truth;
      # STEP0's sync-grafana-admin.sh projects it into this namespace and is
      # run by start-scratch.sh / restart-minikube.sh after Vault is unsealed.
      #
      # optional: true is deliberate. A `kubectl apply -f manifests/` on a
      # cluster where that sync has not run yet must still bring Grafana up
      # (on its built-in admin/admin) rather than wedge the pod in
      # CreateContainerConfigError — monitoring must never be the thing that
      # cannot start while you are trying to find out what else is broken.
      # It is also why Grafana does NOT read Vault directly via the agent
      # injector: that would make the whole observability stack unable to
      # boot whenever Vault is sealed or down.
      - env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: admin-user
              name: grafana-admin
              optional: true
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: admin-password
              name: grafana-admin
              optional: true
        image: grafana/grafana:13.1.1
        name: grafana
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
        # RAISED 2026-08-04 from limits 200Mi / requests 100Mi, which is what
        # kube-prometheus has shipped since the Grafana 9.x era. On 13.1.1 that is not
        # enough: the pod sat at 198Mi against the 200Mi cap and was OOMKilled (exit 137)
        # in a loop. The failure was easy to miss because it is INTERMITTENT — the
        # NodePort answers 200 between restarts, so API checks and `kubectl get po` both
        # look fine, and the only visible symptom was a 502 from nginx-proxy-manager for
        # whoever happened to load the page mid-restart.
        #
        # Grafana 13 is heavier than 9.3.2 on its own, and this instance also parses and
        # holds ~37 provisioned dashboards including the two large Platform ones.
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: grafana-storage
          readOnly: false
        - mountPath: /etc/grafana/provisioning/datasources
          name: grafana-datasources
          readOnly: false
        - mountPath: /etc/grafana/provisioning/dashboards
          name: grafana-dashboards
          readOnly: false
        - mountPath: /tmp
          name: tmp-plugins
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/alertmanager-overview
          name: grafana-dashboard-alertmanager-overview
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/apiserver
          name: grafana-dashboard-apiserver
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/cluster-total
          name: grafana-dashboard-cluster-total
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/controller-manager
          name: grafana-dashboard-controller-manager
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/grafana-overview
          name: grafana-dashboard-grafana-overview
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-resources-cluster
          name: grafana-dashboard-k8s-resources-cluster
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-resources-multicluster
          name: grafana-dashboard-k8s-resources-multicluster
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-resources-namespace
          name: grafana-dashboard-k8s-resources-namespace
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-resources-node
          name: grafana-dashboard-k8s-resources-node
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-resources-nodes-overview
          name: grafana-dashboard-k8s-resources-nodes-overview
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-resources-pod
          name: grafana-dashboard-k8s-resources-pod
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-resources-windows-cluster
          name: grafana-dashboard-k8s-resources-windows-cluster
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-resources-windows-namespace
          name: grafana-dashboard-k8s-resources-windows-namespace
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-resources-windows-pod
          name: grafana-dashboard-k8s-resources-windows-pod
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-resources-workload
          name: grafana-dashboard-k8s-resources-workload
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-resources-workloads-namespace
          name: grafana-dashboard-k8s-resources-workloads-namespace
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-windows-cluster-rsrc-use
          name: grafana-dashboard-k8s-windows-cluster-rsrc-use
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/k8s-windows-node-rsrc-use
          name: grafana-dashboard-k8s-windows-node-rsrc-use
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/kubelet
          name: grafana-dashboard-kubelet
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/namespace-by-pod
          name: grafana-dashboard-namespace-by-pod
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/namespace-by-workload
          name: grafana-dashboard-namespace-by-workload
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/node-cluster-rsrc-use
          name: grafana-dashboard-node-cluster-rsrc-use
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/node-rsrc-use
          name: grafana-dashboard-node-rsrc-use
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/nodes-aix
          name: grafana-dashboard-nodes-aix
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/nodes-darwin
          name: grafana-dashboard-nodes-darwin
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/nodes
          name: grafana-dashboard-nodes
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/persistentvolumesusage
          name: grafana-dashboard-persistentvolumesusage
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/pod-total
          name: grafana-dashboard-pod-total
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/prometheus-remote-write
          name: grafana-dashboard-prometheus-remote-write
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/prometheus
          name: grafana-dashboard-prometheus
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/proxy
          name: grafana-dashboard-proxy
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/scheduler
          name: grafana-dashboard-scheduler
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/0/workload-total
          name: grafana-dashboard-workload-total
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/yolo/yolo-pipeline
          name: grafana-dashboard-yolo-pipeline
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/platform/platform-yolo
          name: grafana-dashboard-platform-yolo
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/platform/platform-ollama
          name: grafana-dashboard-platform-ollama
          readOnly: false
        - mountPath: /grafana-dashboard-definitions/platform/platform-overview
          name: grafana-dashboard-platform-overview
          readOnly: false
        - mountPath: /etc/grafana/provisioning/alerting
          name: grafana-alerting-yolo
          readOnly: false
        - mountPath: /etc/grafana
          name: grafana-config
          readOnly: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      serviceAccountName: grafana
      volumes:
      # Durable, not emptyDir — see grafana-dataVolume.yaml. The emptyDir this replaces
      # destroyed Grafana's SQLite DB on every restart, taking unified-alerting state and
      # silences with it: a restart re-fired already-firing alerts and silently dropped
      # any silence, on the Grafana that is the only thing between a YOLO trading safety
      # condition and a human.
      - persistentVolumeClaim:
          claimName: grafana-storage
        name: grafana-storage
      - name: grafana-datasources
        secret:
          secretName: grafana-datasources
      - configMap:
          name: grafana-dashboards
        name: grafana-dashboards
      - emptyDir:
          medium: Memory
        name: tmp-plugins
