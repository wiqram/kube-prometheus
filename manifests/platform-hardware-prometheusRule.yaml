apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: platform-hardware
    app.kubernetes.io/name: platform-hardware
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: platform-hardware-rules
  namespace: monitoring
# ── LOCAL ADDITION, not upstream kube-prometheus (2026-08-04) ──────────────────────
# Upstream already covers node CPU/memory/filesystem, PV filling, pod crashloops and
# scrape health across 138 rules. It cannot cover THIS BOX's hardware: the thermal
# sensors and the RTX 3080 Ti. That is all this file adds — nothing here duplicates an
# upstream rule, because a duplicate would mean two notifications for one condition.
#
# THRESHOLDS ARE DELIBERATELY COPIED from STEP0's resource-crunch-watch.sh RC_* defaults
# (RC_CPU_TEMP_C=90, RC_GPU_TEMP_C=85, RC_GPU_MEM_PCT=90) so that moving this watching
# from cron into Alertmanager does not silently change WHEN you get told. The `for: 15m`
# reproduces that script's deliberate 3-consecutive-sample debounce (3 x the */5 cron);
# a build spike is not a crunch, and an alert that fires on one sample gets muted.
#
# ON node_hwmon_temp_celsius: this comment used to say the series DOES NOT EXIST here,
# because node-exporter ran with upstream's --no-collector.hwmon. That changed on
# 2026-08-09 — nodeExporter-daemonset.yaml now deliberately enables hwmon, because it is
# the only source of NVMe DRIVE temperature (the GM9000 in M.2_1 holds every app database,
# Jenkins, Vault and Grafana). So hwmon-based rules are now viable.
#
# The CPU rules below still use the x86_pkg_temp thermal zone rather than switching to
# coretemp: it is the same package-level figure, it is what resource-crunch-watch.sh fell
# back to, and rewriting a working rule buys nothing. Do NOT add a coretemp rule alongside
# it — per-core and package temps track each other, so that is two pages per event.
#
# Not yet covered: there is no NVMe over-temperature rule. The dashboard surfaces the
# drive temp, but nothing pages on it. Worth adding (the drive throttles on Composite).
spec:
  groups:
    - name: platform-hardware.cpu
      rules:
        - alert: HostCPUPackageTempHigh
          # i9-12900K, Tjmax 100 C. 90 C sustained is hot but not yet throttling.
          expr: node_thermal_zone_temp{type="x86_pkg_temp"} > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CPU package temperature {{ $value | printf \"%.0f\" }}C exceeds 90C (sustained 15m)"
            description: >-
              CPU package is at {{ $value | printf "%.0f" }}C, above the 90C limit for 15
              minutes.
              Tjmax is 100 C. Check case airflow and what is loading the CPU
              (Jenkins builds and docker image churn are the usual causes on this box).

        - alert: HostCPUPackageTempCritical
          expr: node_thermal_zone_temp{type="x86_pkg_temp"} > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CPU package temperature {{ $value | printf \"%.0f\" }}C exceeds 95C - approaching Tjmax"
            description: >-
              CPU package is at {{ $value | printf "%.0f" }}C, within 5C of Tjmax (100C),
              and will begin thermal throttling. Shed load now.

    - name: platform-hardware.gpu
      rules:
        - alert: GPUTempHigh
          # RTX 3080 Ti throttles around 93 C; 85 C sustained is the early warning.
          expr: DCGM_FI_DEV_GPU_TEMP > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "GPU {{ $labels.gpu }} temperature {{ $value | printf \"%.0f\" }}C exceeds 85C (sustained 15m)"
            description: >-
              GPU {{ $labels.gpu }} ({{ $labels.modelName }}) is at
              {{ $value | printf "%.0f" }}C, above the 85C limit for 15 minutes. It throttles
              near 93C. ollama inference is the usual load on this GPU.

        - alert: GPUTempCritical
          expr: DCGM_FI_DEV_GPU_TEMP > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "GPU {{ $labels.gpu }} temperature {{ $value | printf \"%.0f\" }}C exceeds 90C - throttling imminent"
            description: >-
              GPU {{ $labels.gpu }} ({{ $labels.modelName }}) is at
              {{ $value | printf "%.0f" }}C and is about to thermal throttle (~93C).

        - alert: GPUMemoryAlmostFull
          # FB_USED and FB_FREE are MiB and share every label, so the division needs no
          # on()/ignoring(). Percentage rather than absolute: the card is 12 GB and ollama
          # already holds ~9.4 GB at rest, so an absolute threshold would be meaningless.
          expr: >-
            DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "GPU {{ $labels.gpu }} framebuffer {{ $value | humanizePercentage }} full"
            description: >-
              GPU {{ $labels.gpu }} framebuffer is {{ $value | humanizePercentage }} full -
              less than 10% of the 12GB card is free. A further model load will fail or fall
              back to CPU. Check what ollama is holding resident.

    # ── Host memory pressure (2026-11-16) ──────────────────────────────────────────────
    # Upstream has NodeMemoryHighUtilization (RAM % used) but nothing on SWAP or memory
    # STALLS, and on this box RAM % is the wrong signal: page cache keeps it high on a
    # healthy day, while a full swap is what the desktop actually feels. On 2026-11-16 the
    # host sat at 27/29Gi swap (zram full) for hours — /tmp is a RAM tmpfs and held 24Gi of
    # agent scratch — and nothing paged. node-exporter's meminfo and PSI series are the
    # HOST's (verified: SwapFree/Shmem match the host /proc/meminfo), so this is a host rule.
    # job="node-exporter" excludes the dev box's scrape (job="devbox"), which never pages.
    # STEP0 host-tmp-guard.sh is the fix side; this is the "it's happening again" side.
    - name: platform-hardware.memory
      rules:
        - alert: HostSwapAlmostFull
          # 7-day history at write time: >80% for ~9.6h, all of it the 11-16 incident.
          expr: >-
            1 - node_memory_SwapFree_bytes{job="node-exporter"}
              / node_memory_SwapTotal_bytes{job="node-exporter"} > 0.80
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Host swap {{ $value | humanizePercentage }} full"
            description: >-
              Host swap has been over 80% for 30 minutes ({{ $value | humanizePercentage }}).
              The desktop and IDE are being paged out. Usual suspects: a RAM-backed /tmp
              (STEP0: ./host-tmp-guard.sh --status), the minikube cgroup, many Claude sessions.
        - alert: HostMemoryStalling
          # PSI "full": share of time ALL non-idle tasks were stalled on memory. 7-day max of
          # the 15m average at write time was 0.023 (the 11-16 incident) — so 0.02 pages on a
          # repeat of that day, not on a normal build spike.
          expr: >-
            rate(node_pressure_memory_stalled_seconds_total{job="node-exporter"}[15m]) > 0.02
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Host stalled on memory {{ $value | humanizePercentage }} of the time"
            description: >-
              For 15 minutes every runnable task on the host was blocked on memory
              {{ $value | humanizePercentage }} of the time (PSI full) — the machine is
              thrashing. See HostSwapAlmostFull and STEP0 host-tmp-guard.sh --status.
