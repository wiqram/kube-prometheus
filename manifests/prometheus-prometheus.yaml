apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 3.14.0
  name: k8s
  namespace: monitoring
spec:
  alerting:
    alertmanagers:
    - apiVersion: v2
      name: alertmanager-main
      namespace: monitoring
      port: web
  enableFeatures: []
  externalLabels: {}
  image: quay.io/prometheus/prometheus:v3.14.0
  nodeSelector:
    kubernetes.io/os: linux
  podMetadata:
    labels:
      app.kubernetes.io/component: prometheus
      app.kubernetes.io/instance: k8s
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/part-of: kube-prometheus
      app.kubernetes.io/version: 3.14.0
  podMonitorNamespaceSelector: {}
  podMonitorSelector: {}
  probeNamespaceSelector: {}
  probeSelector: {}
  # Single-node cluster: 2 replicas was HA for no benefit. 1 replica.
  replicas: 1
  # TSDB retention. Since 2026-11-13 the TSDB is DURABLE (see `storage:` below and
  # prometheus-dataVolume.yaml) — on /mnt/minikube-mnt, swept by the weekly DR archive —
  # so these two numbers now size BOTH the live volume and every weekly archive.
  # Whichever limit is hit first wins: 30d is the intent, retentionSize is the ceiling
  # that keeps a series explosion from filling the shared mount (5.8 GiB / 27 d measured
  # at the switch, so 20GB is ~3x headroom).
  #
  # Raised 7d -> 30d (2026-08-31) for the ollama token-usage dashboard's per-day/week
  # panels — increase(...[1d]) over more than a few days needs more than 7d of history
  # to show a trend. Measured cost at the time: 629 MiB for 7 days (~90 MiB/day), against
  # 809 GiB free on /var/lib/docker — 30d is ~2.7 GiB, noise on this box. Revisit the
  # number if the app-namespace custom-metrics scope (docs: CUSTOM-METRICS.md) grows a
  # lot, since that's what actually drives series count, not this window.
  retention: 30d
  retentionSize: 20GB
  # Durable TSDB on a pre-created manual PV (prometheus-dataVolume.yaml). volumeName pins
  # the claim the StatefulSet generates to that PV. disableMountSubPath: the TSDB sits at
  # the volume root (like grafana-data) instead of the operator's default `prometheus-db/`
  # subdirectory, so the host path IS the TSDB.
  storage:
    disableMountSubPath: true
    volumeClaimTemplate:
      metadata:
        name: prometheus-k8s-db
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: manual
        volumeName: prometheus-data-pv
        resources:
          requests:
            storage: 30Gi
  resources:
    requests:
      cpu: 100m
      memory: 400Mi
    limits:
      memory: 1Gi
  ruleNamespaceSelector: {}
  ruleSelector: {}
  scrapeConfigNamespaceSelector: {}
  scrapeConfigSelector: {}
  securityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
  serviceAccountName: prometheus-k8s
  serviceDiscoveryRole: EndpointSlice
  serviceMonitorNamespaceSelector: {}
  serviceMonitorSelector: {}
  version: 3.14.0
