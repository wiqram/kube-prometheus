apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  labels:
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/instance: main
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 0.34.1
  name: main
  namespace: monitoring
spec:
  alertmanagerConfigSelector: {}
  image: quay.io/prometheus/alertmanager:v0.34.1
  nodeSelector:
    kubernetes.io/os: linux
  podMetadata:
    labels:
      app.kubernetes.io/component: alert-router
      app.kubernetes.io/instance: main
      app.kubernetes.io/name: alertmanager
      app.kubernetes.io/part-of: kube-prometheus
      app.kubernetes.io/version: 0.34.1
  # Single-node cluster: a 3-replica gossip cluster is pure waste here. 1 replica.
  replicas: 1
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 4m
      memory: 100Mi
  # Token for the platform's self-hosted ntfy (2026-11-13), read by the webhook receivers via
  # credentials_file so it never appears in the committed alertmanager-secret.yaml. Mounted
  # at /etc/alertmanager/secrets/alertmanager-ntfy-token/token. Created from STEP0/.env by
  # STEP0 `ntfy-server.sh --k8s-secret`, which start-scratch.sh runs BEFORE manifests/ —
  # if it is missing, alertmanager-main-0 cannot start.
  secrets:
  - alertmanager-ntfy-token
  securityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
  serviceAccountName: alertmanager-main
  version: 0.34.1
