apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 1.12.1
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: exporter
      app.kubernetes.io/name: node-exporter
      app.kubernetes.io/part-of: kube-prometheus
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: node-exporter
      labels:
        app.kubernetes.io/component: exporter
        app.kubernetes.io/name: node-exporter
        app.kubernetes.io/part-of: kube-prometheus
        app.kubernetes.io/version: 1.12.1
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --web.listen-address=127.0.0.1:9101
        - --path.sysfs=/host/sys
        - --path.rootfs=/host/root
        - --path.procfs=/host/root/proc
        - --path.udev.data=/host/root/run/udev/data
        - --no-collector.wifi
        # LOCAL ADDITION 2026-08-09 — upstream ships `--no-collector.hwmon` here; we
        # deliberately do NOT. This box is a workstation, not a rented VM, and hwmon is
        # the only source of DRIVE temperature: the 4TB Predator GM9000 NVMe in slot
        # M.2_1 carries every app database, Jenkins, Vault and Grafana, and a hot NVMe
        # throttles long before it fails. Nothing else exposes it — the node-exporter
        # `nvme` collector emits only `node_nvme_info` (no temps), and smartctl would
        # mean a second exporter.
        #
        # Enabling it also gives per-core `coretemp` readings, which are strictly better
        # than the single `node_thermal_zone_temp{type="x86_pkg_temp"}` we had.
        #
        # Cheap here because the collector is scoped by the hardware present, not by
        # workload: this host has 6 hwmon chips (acpitz, nvme, enp5s0, asus, iwlwifi,
        # coretemp), so this is tens of series, not the per-mountpoint explosion the
        # filesystem flag below exists to contain.
        #
        # Requires no new mounts: /sys is already bind-mounted to /host/sys (read-only)
        # and sysfs is not namespaced, so the DaemonSet sees the real host sensors from
        # inside the minikube container.
        - --no-collector.btrfs
        # LOCAL ADDITION 2026-08-04 — everything from `|data|` onward is ours; the prefix is
        # upstream. WHY: node-exporter reports one series per MOUNTPOINT, but alert rules
        # like NodeFilesystemSpaceFillingUp fire per series, so a single full disk pages
        # once per bind-mount of it. On this box that meant 52 filesystem series for FOUR
        # real disks, and a genuine /var alert arrived SEVEN times.
        #
        # /dev/sda5 was the worst: 35 mountpoints, every one an individual NVIDIA driver
        # file (libnvidia-*.so, nvidia-smi, gsp firmware) bind-mounted in by the container
        # runtime. Had sda5 ever crossed the threshold that is 35 identical pages.
        #
        # Excluded here: the nvidia file mounts, docker's injected /etc/hostname|hosts|
        # resolv.conf, systemd's /run/credentials ramfs, and the sda7 duplicates
        # (/data, /tmp/hostpath-provisioner, /tmp/hostpath_pv) which are the same device
        # as /var. Result: 52 series -> 7, exactly one per physical device (plus three
        # genuinely distinct tmpfs).
        #
        # NOTE /dev/sda5 (the host root) is now represented by its /usr/lib/modules mount,
        # so an alert about "/usr/lib/modules" means the HOST ROOT is filling, not a
        # modules directory. That mount is kept precisely because it is the only sda5 path
        # whose name has no driver version in it — the libnvidia-*.so paths embed
        # "580.173.02" and would silently stop matching on the next driver upgrade.
        #
        # REGRESSED, then re-fixed 2026-11-13: a newer nvidia-container-toolkit started
        # bind-mounting ten MORE host-root files (/etc/OpenCL, /etc/vulkan, /usr/share/
        # {X11,egl,glvnd,nvidia}) — 7 series had quietly become 18, so a filling root would
        # page 11 times. It also mounts a 4 KiB, 100%-full tmpfs at
        # /run/nvidia-ctk-hook/<uuid>, which fired NodeFilesystemAlmostOutOfSpace (critical
        # AND warning) continuously from 11-07 to 11-13 — a permanent false critical, the
        # kind that teaches the reader to skim past the real one. Excluded by DIRECTORY,
        # never by file or uuid, for the same reason as the driver-version note above.
        # To re-check after a toolkit/driver upgrade: `count(node_filesystem_size_bytes)`
        # should be 7; anything more is a new bind-mount to add here.
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/k3s/containerd/.+|var/lib/docker/.+|var/lib/kubelet/pods/.+|data|etc/(hostname|hosts|resolv\.conf)|etc/nvidia/.+|etc/(OpenCL|vulkan)/.+|run/credentials/.+|run/nvidia-persistenced/.+|run/nvidia-ctk-hook/.+|tmp/hostpath.*|usr/bin/nvidia-.+|usr/lib/firmware/nvidia/.+|usr/lib/x86_64-linux-gnu/.+|usr/share/(X11|egl|glvnd|nvidia)/.+)($|/)
        - --collector.netclass.ignored-devices=^(veth.*|[a-f0-9]{15})$
        - --collector.netdev.device-exclude=^(veth.*|[a-f0-9]{15})$
        image: quay.io/prometheus/node-exporter:v1.12.1
        name: node-exporter
        resources:
          limits:
            cpu: 250m
            memory: 180Mi
          requests:
            cpu: 102m
            memory: 180Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - SYS_TIME
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /host/sys
          mountPropagation: HostToContainer
          name: sys
          readOnly: true
        - mountPath: /host/root
          mountPropagation: HostToContainer
          name: root
          readOnly: true
      - args:
        - --secure-listen-address=[$(IP)]:9100
        - --tls-cipher-suites=TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - --upstream=http://127.0.0.1:9101/
        env:
        - name: IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: quay.io/brancz/kube-rbac-proxy:v0.22.1
        name: kube-rbac-proxy
        ports:
        - containerPort: 9100
          hostPort: 9100
          name: https
        resources:
          limits:
            cpu: 20m
            memory: 40Mi
          requests:
            cpu: 10m
            memory: 20Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: true
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      serviceAccountName: node-exporter
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /sys
        name: sys
      - hostPath:
          path: /
        name: root
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
    type: RollingUpdate
