apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/instance: main
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 0.34.1
  name: alertmanager-main
  namespace: monitoring
spec:
  egress:
  - {}
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - port: 9093
      protocol: TCP
    - port: 8080
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: alertmanager
    ports:
    - port: 9094
      protocol: TCP
    - port: 9094
      protocol: UDP
  # LOCAL ADDITION (2026-08-04): let Grafana read Alertmanager.
  # Upstream admits only app.kubernetes.io/name=prometheus on 9093, so the
  # "Alertmanager" datasource added in grafana-dashboardDatasources.yaml would be
  # silently unreachable without this — Grafana renders an empty alert list rather
  # than an error, which is the worst possible failure mode for an alerting UI.
  # Read-only: 9093 is Alertmanager's HTTP API and Grafana is configured with
  # handleGrafanaManagedAlerts=false, so it consumes alerts and never pushes any.
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
    ports:
    - port: 9093
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: alert-router
      app.kubernetes.io/instance: main
      app.kubernetes.io/name: alertmanager
      app.kubernetes.io/part-of: kube-prometheus
  policyTypes:
  - Egress
  - Ingress
