                  "fieldConfig": {
                      "defaults": {},
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 7,
                      "w": 24,
                      "x": 0,
                      "y": 137
                  },
                  "options": {
                      "content": "Three independent sources, none of which sit in the inference path:\n\n**GPU** \u2014 `dcgm-exporter` (kube-prometheus `manifests/dcgmExporter.yaml`). It deliberately does **not** request `nvidia.com/gpu`: the node advertises exactly one and ollama holds it, so it takes the device via the node's `nvidia` default container runtime instead. DCGM's *profiling* fields are unavailable on this consumer GeForce card by design, not by fault.\n\n**Router** \u2014 HAProxy's built-in exporter on `:8405` plus the stats sidecar's `/metrics`, giving requests by model and by box and upstream up/down (including the silent 10GbE failover to prod).\n\n**Model server** \u2014 `ollama-metrics-shim`, because Ollama 0.30.8 still serves no `/metrics` of its own. `/api/ps` supplies residency, VRAM and the eviction countdown; the throughput and load-time figures come from a **small synthetic generation every 5 minutes**, the way blackbox-exporter probes an endpoint.\n\n**So read the throughput panels as a trend, not as per-request latency.** Real per-request timings exist \u2014 Ollama returns them in each response's final chunk \u2014 but harvesting them means putting a proxy between every caller and the model server, including yolo's. That was rejected: a bug or restart there breaks production inference, and this is a monitoring feature. The probe also refuses to run when no model is resident, so monitoring can never trigger the ~9.5 GB cold load it exists to measure.",
                      "mode": "markdown"
                  },
                  "targets": [],
                  "title": "How these numbers are obtained",
                  "type": "text"
              }
