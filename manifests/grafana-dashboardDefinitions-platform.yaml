# Platform dashboards — per-namespace performance & resource usage.
#
# OWNED BY THIS REPO, unlike the YOLO folder (see YOLO-OWNERSHIP.md). The split is by
# SIGNAL, not by subject: everything here comes from platform-level sources the app does
# not participate in — cAdvisor via the kubelet, kube-state-metrics — plus, for yolo, the
# yolo_* series Prometheus already scrapes. Nothing here encodes yolo's or ollama's
# business logic, so it cannot drift out of step with their repos the way the old
# yolo-grafana-extras.yaml did. Business/pipeline dashboards stay in the app repos.
#
# EVERY query in these dashboards was probed against live Prometheus before being added
# and returned a non-empty result. A panel that renders "No data" is worse than no panel:
# it reads as broken monitoring and teaches people to stop trusting the dashboard.
#
# Two shapes of panel are still expected to read empty, and that is CORRECT: counters of
# bad things (OOM kills, failed jobs, containers not ready) sit at zero on a healthy
# cluster, which is why they use `or vector(0)` so they render 0 rather than "No data".
#
# NOTE ON cAdvisor: on this node the kubelet's container_* series carry `namespace` and
# `pod` but NO `container` label, so every resource panel aggregates by pod and there is
# no per-container breakdown. Do not add one expecting it to work.
#
# THIS FILE IS THE SOURCE OF TRUTH — edit the JSON here. It is mounted by
# grafana-deployment.yaml and surfaced by the "Platform" provider in
# grafana-dashboardSources.yaml; renaming either ConfigMap silently unmounts it.
apiVersion: v1
kind: ConfigMapList
items:
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: grafana-dashboard-platform-yolo
    namespace: monitoring
    labels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: kube-prometheus
  data:
    platform-yolo.json: |-
      {
          "editable": true,
          "graphTooltip": 1,
          "panels": [
              {
                  "collapsed": false,
                  "gridPos": {
                      "h": 1,
                      "w": 24,
                      "x": 0,
                      "y": 0
                  },
                  "panels": [],
                  "title": "Health & availability",
                  "type": "row"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Pods in Running phase right now.",
                  "fieldConfig": {
                      "defaults": {
                          "thresholds": {
                              "mode": "absolute",
                              "steps": [
                                  {
                                      "color": "green",
                                      "value": null
                                  }
                              ]
                          }
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 4,
                      "w": 4,
                      "x": 0,
                      "y": 1
                  },
                  "options": {
                      "colorMode": "value",
                      "graphMode": "area",
                      "justifyMode": "auto",
                      "reduceOptions": {
                          "calcs": [
                              "lastNotNull"
                          ],
                          "fields": "",
                          "values": false
                      },
                      "textMode": "auto"
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "count(kube_pod_status_phase{namespace=\"yolo\",phase=\"Running\"} == 1)",
                          "intervalFactor": 2
                      }
                  ],
                  "title": "Pods running",
                  "type": "stat"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Pending/Failed/Unknown. Completed CronJob pods are excluded by phase.",
                  "fieldConfig": {
                      "defaults": {
                          "thresholds": {
                              "mode": "absolute",
                              "steps": [
                                  {
                                      "color": "green",
                                      "value": null
                                  },
                                  {
                                      "color": "red",
                                      "value": 1
                                  }
                              ]
                          }
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 4,
                      "w": 4,
                      "x": 4,
                      "y": 1
                  },
                  "options": {
                      "colorMode": "value",
                      "graphMode": "area",
                      "justifyMode": "auto",
                      "reduceOptions": {
                          "calcs": [
                              "lastNotNull"
                          ],
                          "fields": "",
                          "values": false
                      },
                      "textMode": "auto"
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "count(kube_pod_status_phase{namespace=\"yolo\",phase=~\"Pending|Failed|Unknown\"} == 1) or vector(0)",
                          "intervalFactor": 2
                      }
                  ],
                  "title": "Pods not running",
                  "type": "stat"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Containers failing their readiness probe.",
                  "fieldConfig": {
                      "defaults": {
                          "thresholds": {
                              "mode": "absolute",
                              "steps": [
                                  {
                                      "color": "green",
                                      "value": null
                                  },
                                  {
                                      "color": "red",
                                      "value": 1
                                  }
                              ]
                          }
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 4,
                      "w": 4,
                      "x": 8,
                      "y": 1
                  },
                  "options": {
                      "colorMode": "value",
                      "graphMode": "area",
                      "justifyMode": "auto",
                      "reduceOptions": {
                          "calcs": [
                              "lastNotNull"
                          ],
                          "fields": "",
                          "values": false
                      },
                      "textMode": "auto"
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "count(kube_pod_container_status_ready{namespace=\"yolo\"} == 0) or vector(0)",
                          "intervalFactor": 2
                      }
                  ],
                  "title": "Containers not ready",
                  "type": "stat"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Container restarts in the last hour. Sustained non-zero means a crash loop.",
                  "fieldConfig": {
                      "defaults": {
                          "thresholds": {
                              "mode": "absolute",
                              "steps": [
                                  {
                                      "color": "green",
                                      "value": null
                                  },
                                  {
                                      "color": "yellow",
                                      "value": 1
                                  },
                                  {
                                      "color": "red",
                                      "value": 5
                                  }
                              ]
                          }
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 4,
                      "w": 4,
                      "x": 12,
                      "y": 1
                  },
                  "options": {
                      "colorMode": "value",
                      "graphMode": "area",
                      "justifyMode": "auto",
                      "reduceOptions": {
                          "calcs": [
                              "lastNotNull"
                          ],
                          "fields": "",
                          "values": false
                      },
                      "textMode": "auto"
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"yolo\"}[1h])) or vector(0)",
                          "intervalFactor": 2
                      }
                  ],
                  "title": "Restarts (1h)",
                  "type": "stat"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Desired minus available across all Deployments. Non-zero = a rollout is stuck or a pod won't schedule.",
                  "fieldConfig": {
                      "defaults": {
                          "thresholds": {
                              "mode": "absolute",
                              "steps": [
                                  {
                                      "color": "green",
                                      "value": null
                                  },
                                  {
                                      "color": "red",
                                      "value": 1
                                  }
                              ]
                          }
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 4,
                      "w": 4,
                      "x": 16,
                      "y": 1
                  },
                  "options": {
                      "colorMode": "value",
                      "graphMode": "area",
                      "justifyMode": "auto",
                      "reduceOptions": {
                          "calcs": [
                              "lastNotNull"
                          ],
                          "fields": "",
                          "values": false
                      },
                      "textMode": "auto"
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum(kube_deployment_spec_replicas{namespace=\"yolo\"}) - sum(kube_deployment_status_replicas_available{namespace=\"yolo\"})",
                          "intervalFactor": 2
                      }
                  ],
                  "title": "Replicas unavailable",
                  "type": "stat"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Any value here means a container exceeded its memory limit and was killed.",
                  "fieldConfig": {
                      "defaults": {
                          "thresholds": {
                              "mode": "absolute",
                              "steps": [
                                  {
                                      "color": "green",
                                      "value": null
                                  },
                                  {
                                      "color": "red",
                                      "value": 1
                                  }
                              ]
                          }
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 4,
                      "w": 4,
                      "x": 20,
                      "y": 1
                  },
                  "options": {
                      "colorMode": "value",
                      "graphMode": "area",
                      "justifyMode": "auto",
                      "reduceOptions": {
                          "calcs": [
                              "lastNotNull"
                          ],
                          "fields": "",
                          "values": false
                      },
                      "textMode": "auto"
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum(increase(container_oom_events_total{namespace=\"yolo\"}[1h])) or vector(0)",
                          "intervalFactor": 2
                      }
                  ],
                  "title": "OOM kills (1h)",
                  "type": "stat"
              },
              {
                  "collapsed": false,
                  "gridPos": {
                      "h": 1,
                      "w": 24,
                      "x": 0,
                      "y": 5
                  },
                  "panels": [],
                  "title": "Resource usage",
                  "type": "row"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Cores. cAdvisor here carries no container label, so this is whole-pod usage.",
                  "fieldConfig": {
                      "defaults": {
                          "custom": {
                              "fillOpacity": 8,
                              "gradientMode": "opacity",
                              "lineWidth": 1,
                              "showPoints": "never",
                              "spanNulls": true
                          },
                          "unit": "short"
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 7,
                      "w": 12,
                      "x": 0,
                      "y": 6
                  },
                  "options": {
                      "legend": {
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                      },
                      "tooltip": {
                          "mode": "multi",
                          "sort": "desc"
                      }
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "topk(10, sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"yolo\"}[5m])))",
                          "intervalFactor": 2,
                          "legendFormat": "{{pod}}"
                      }
                  ],
                  "title": "CPU by pod (top 10)",
                  "type": "timeseries"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Working set is what the kernel counts against the memory limit \u2014 the number that gets a pod OOM-killed.",
                  "fieldConfig": {
                      "defaults": {
                          "custom": {
                              "fillOpacity": 8,
                              "gradientMode": "opacity",
                              "lineWidth": 1,
                              "showPoints": "never",
                              "spanNulls": true
                          },
                          "unit": "bytes"
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 7,
                      "w": 12,
                      "x": 12,
                      "y": 6
                  },
                  "options": {
                      "legend": {
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                      },
                      "tooltip": {
                          "mode": "multi",
                          "sort": "desc"
                      }
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "topk(10, sum by (pod) (container_memory_working_set_bytes{namespace=\"yolo\"}))",
                          "intervalFactor": 2,
                          "legendFormat": "{{pod}}"
                      }
                  ],
                  "title": "Memory working set by pod (top 10)",
                  "type": "timeseries"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Only pods WITH a memory limit appear. Approaching 100% predicts the OOM-kill panel above.",
                  "fieldConfig": {
                      "defaults": {
                          "custom": {
                              "fillOpacity": 8,
                              "gradientMode": "opacity",
                              "lineWidth": 1,
                              "showPoints": "never",
                              "spanNulls": true
                          },
                          "unit": "percent"
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 7,
                      "w": 12,
                      "x": 0,
                      "y": 13
                  },
                  "options": {
                      "legend": {
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                      },
                      "tooltip": {
                          "mode": "multi",
                          "sort": "desc"
                      }
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "100 * sum by (pod) (container_memory_working_set_bytes{namespace=\"yolo\"}) / clamp_min(sum by (pod) (container_spec_memory_limit_bytes{namespace=\"yolo\"} > 0), 1)",
                          "intervalFactor": 2,
                          "legendFormat": "{{pod}}"
                      }
                  ],
                  "title": "Memory as % of limit",
                  "type": "timeseries"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Share of CPU periods where the pod wanted CPU and was held back by its limit. This is the metric that explains 'slow but not busy'.",
                  "fieldConfig": {
                      "defaults": {
                          "custom": {
                              "fillOpacity": 8,
                              "gradientMode": "opacity",
                              "lineWidth": 1,
                              "showPoints": "never",
                              "spanNulls": true
                          },
                          "unit": "percent"
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 7,
                      "w": 12,
                      "x": 12,
                      "y": 13
                  },
                  "options": {
                      "legend": {
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                      },
                      "tooltip": {
                          "mode": "multi",
                          "sort": "desc"
                      }
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "100 * sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"yolo\"}[5m])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"yolo\"}[5m])), 1)",
                          "intervalFactor": 2,
                          "legendFormat": "{{pod}}"
                      }
                  ],
                  "title": "CPU throttled %",
                  "type": "timeseries"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Used versus the sum of requests \u2014 i.e. whether the reservations match reality.",
                  "fieldConfig": {
                      "defaults": {
                          "custom": {
                              "fillOpacity": 8,
                              "gradientMode": "opacity",
                              "lineWidth": 1,
                              "showPoints": "never",
                              "spanNulls": true
                          },
                          "unit": "short"
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 7,
                      "w": 12,
                      "x": 0,
                      "y": 20
                  },
                  "options": {
                      "legend": {
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                      },
                      "tooltip": {
                          "mode": "multi",
                          "sort": "desc"
                      }
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"yolo\"}[5m]))",
                          "intervalFactor": 2,
                          "legendFormat": "used"
                      },
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum(kube_pod_container_resource_requests{namespace=\"yolo\",resource=\"cpu\"})",
                          "intervalFactor": 2,
                          "legendFormat": "requested"
                      }
                  ],
                  "title": "Namespace CPU: used vs requested",
                  "type": "timeseries"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Used versus the sum of requests.",
                  "fieldConfig": {
                      "defaults": {
                          "custom": {
                              "fillOpacity": 8,
                              "gradientMode": "opacity",
                              "lineWidth": 1,
                              "showPoints": "never",
                              "spanNulls": true
                          },
                          "unit": "bytes"
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 7,
                      "w": 12,
                      "x": 12,
                      "y": 20
                  },
                  "options": {
                      "legend": {
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                      },
                      "tooltip": {
                          "mode": "multi",
                          "sort": "desc"
                      }
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum(container_memory_working_set_bytes{namespace=\"yolo\"})",
                          "intervalFactor": 2,
                          "legendFormat": "used"
                      },
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum(kube_pod_container_resource_requests{namespace=\"yolo\",resource=\"memory\"})",
                          "intervalFactor": 2,
                          "legendFormat": "requested"
                      }
                  ],
                  "title": "Namespace memory: used vs requested",
                  "type": "timeseries"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "This host's /var/lib/docker is on an ageing SATA SSD; write storms here are the known cause of container-create timeouts.",
                  "fieldConfig": {
                      "defaults": {
                          "custom": {
                              "fillOpacity": 8,
                              "gradientMode": "opacity",
                              "lineWidth": 1,
                              "showPoints": "never",
                              "spanNulls": true
                          },
                          "unit": "Bps"
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 7,
                      "w": 12,
                      "x": 0,
                      "y": 27
                  },
                  "options": {
                      "legend": {
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                      },
                      "tooltip": {
                          "mode": "multi",
                          "sort": "desc"
                      }
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum by (pod) (rate(container_fs_writes_bytes_total{namespace=\"yolo\"}[5m]))",
                          "intervalFactor": 2,
                          "legendFormat": "{{pod}}"
                      }
                  ],
                  "title": "Disk write throughput by pod",
                  "type": "timeseries"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "fieldConfig": {
                      "defaults": {
                          "custom": {
                              "fillOpacity": 8,
                              "gradientMode": "opacity",
                              "lineWidth": 1,
                              "showPoints": "never",
                              "spanNulls": true
                          },
                          "unit": "Bps"
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 7,
                      "w": 12,
                      "x": 12,
                      "y": 27
                  },
                  "options": {
                      "legend": {
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                      },
                      "tooltip": {
                          "mode": "multi",
                          "sort": "desc"
                      }
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum by (pod) (rate(container_fs_reads_bytes_total{namespace=\"yolo\"}[5m]))",
                          "intervalFactor": 2,
                          "legendFormat": "{{pod}}"
                      }
                  ],
                  "title": "Disk read throughput by pod",
                  "type": "timeseries"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Fraction of wall-clock the pod spent stalled waiting for CPU. Rises before throttling becomes obvious.",
                  "fieldConfig": {
                      "defaults": {
                          "custom": {
                              "fillOpacity": 8,
                              "gradientMode": "opacity",
                              "lineWidth": 1,
                              "showPoints": "never",
                              "spanNulls": true
                          },
                          "unit": "percentunit"
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 7,
                      "w": 12,
                      "x": 0,
                      "y": 34
                  },
                  "options": {
                      "legend": {
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                      },
                      "tooltip": {
                          "mode": "multi",
                          "sort": "desc"
                      }
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum by (pod) (rate(container_pressure_cpu_waiting_seconds_total{namespace=\"yolo\"}[5m]))",
                          "intervalFactor": 2,
                          "legendFormat": "{{pod}}"
                      }
                  ],
                  "title": "CPU pressure (PSI) \u2014 time waiting",
                  "type": "timeseries"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Fraction of wall-clock stalled on IO.",
                  "fieldConfig": {
                      "defaults": {
                          "custom": {
                              "fillOpacity": 8,
                              "gradientMode": "opacity",
                              "lineWidth": 1,
                              "showPoints": "never",
                              "spanNulls": true
                          },
                          "unit": "percentunit"
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 7,
                      "w": 12,
                      "x": 12,
                      "y": 34
                  },
                  "options": {
                      "legend": {
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                      },
                      "tooltip": {
                          "mode": "multi",
                          "sort": "desc"
                      }
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum by (pod) (rate(container_pressure_io_waiting_seconds_total{namespace=\"yolo\"}[5m]))",
                          "intervalFactor": 2,
                          "legendFormat": "{{pod}}"
                      }
                  ],
                  "title": "IO pressure (PSI) \u2014 time waiting",
