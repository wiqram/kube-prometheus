                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "sum(kube_job_status_failed{namespace=\"ollama\"}) or vector(0)",
                          "intervalFactor": 2,
                          "legendFormat": "failed"
                      }
                  ],
                  "title": "Failed jobs",
                  "type": "timeseries"
