                  "options": {
                      "content": "**GPU metrics** come from `dcgm-exporter` (added 2026-08-04, kube-prometheus `manifests/dcgmExporter.yaml`). It deliberately does **not** request `nvidia.com/gpu` \u2014 the node advertises exactly one and ollama holds it \u2014 and gets the device via the node's `nvidia` default container runtime instead. DCGM's *profiling* fields (PCIE throughput, DRAM active) are unavailable on this consumer GeForce card and are absent by design, not by fault.\n\n**Inference counts** come from the ollama-router stats sidecar's `/metrics`, and **proxy/upstream health** from HAProxy's built-in Prometheus exporter on `:8405`. Between them you get requests by model and by box, upstream up/down, queueing and connect time.\n\n**Still not measured: the Ollama server itself.** `/metrics` on `ollama:11434` returns 404 \u2014 upstream Ollama exposes no Prometheus endpoint \u2014 so tokens/sec, prompt-vs-generation split, model load time and queue depth *inside* the server remain invisible. Everything above is measured at the proxy or at the GPU, which is as close as you can get without the server's cooperation. See STEP0 `plan.md` #18.",
