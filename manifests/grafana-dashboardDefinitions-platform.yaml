                  "options": {
                      "content": "**No Ollama application metrics.** Ollama serves no Prometheus endpoint \u2014 `/metrics` on both `ollama:11434` and `ollama-router-stats:8080` returns **404** (checked 2026-08-04). `ollama-router-stats` renders an HTML page, not a metrics exposition. So there is no ServiceMonitor for this namespace and nothing here reports tokens/sec, queue depth, model load time or request counts. Getting those needs a metrics endpoint on the router first; the dashboard is the easy half.\n\n**No GPU metrics.** This box has an RTX 3080 Ti and Ollama is the main consumer, but the cluster runs only the `nvidia-device-plugin` (which *schedules* GPUs) \u2014 there is no DCGM exporter, so Prometheus holds no GPU utilisation, VRAM or temperature series at all. GPU pressure is currently watched only by STEP0's `resource-crunch-watch.sh`, which shells out to `nvidia-smi` on the host and pushes to ntfy `yolo-private-cloud-resource-crunch`. Adding `dcgm-exporter` plus a ServiceMonitor would put those series here \u2014 see STEP0 `plan.md`.\n\nEverything above is therefore container-level: what the kernel and Kubernetes can see without the application's cooperation.",
