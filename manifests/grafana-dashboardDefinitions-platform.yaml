- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: grafana-dashboard-platform-ollama
    namespace: monitoring
    labels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: kube-prometheus
  data:
    platform-ollama.json: |-
      {
          "editable": true,
          "graphTooltip": 1,
          "panels": [
              {
                  "collapsed": false,
                  "gridPos": {
                      "h": 1,
                      "w": 24,
                      "x": 0,
                      "y": 0
                  },
                  "panels": [],
                  "title": "Health & availability",
                  "type": "row"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Pods in Running phase right now.",
                  "fieldConfig": {
                      "defaults": {
                          "thresholds": {
                              "mode": "absolute",
                              "steps": [
                                  {
                                      "color": "green",
                                      "value": null
                                  }
                              ]
                          }
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 4,
                      "w": 4,
                      "x": 0,
                      "y": 1
                  },
                  "options": {
                      "colorMode": "value",
                      "graphMode": "area",
                      "justifyMode": "auto",
                      "reduceOptions": {
                          "calcs": [
                              "lastNotNull"
                          ],
                          "fields": "",
                          "values": false
                      },
                      "textMode": "auto"
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "count(kube_pod_status_phase{namespace=\"ollama\",phase=\"Running\"} == 1)",
                          "intervalFactor": 2
                      }
                  ],
                  "title": "Pods running",
                  "type": "stat"
              },
              {
                  "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                  },
                  "description": "Pending/Failed/Unknown. Completed CronJob pods are excluded by phase.",
                  "fieldConfig": {
                      "defaults": {
                          "thresholds": {
                              "mode": "absolute",
                              "steps": [
                                  {
                                      "color": "green",
                                      "value": null
                                  },
                                  {
                                      "color": "red",
                                      "value": 1
                                  }
                              ]
                          }
                      },
                      "overrides": []
                  },
                  "gridPos": {
                      "h": 4,
                      "w": 4,
                      "x": 4,
                      "y": 1
                  },
                  "options": {
                      "colorMode": "value",
                      "graphMode": "area",
                      "justifyMode": "auto",
                      "reduceOptions": {
                          "calcs": [
                              "lastNotNull"
                          ],
                          "fields": "",
                          "values": false
                      },
                      "textMode": "auto"
                  },
                  "targets": [
                      {
                          "datasource": {
                              "type": "prometheus",
                              "uid": "$datasource"
                          },
                          "expr": "count(kube_pod_status_phase{namespace=\"ollama\",phase=~\"Pending|Failed|Unknown\"} == 1) or vector(0)",
                          "intervalFactor": 2
