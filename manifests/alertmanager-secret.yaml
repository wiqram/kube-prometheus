apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/instance: main
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 0.33.1
  name: alertmanager-main
  namespace: monitoring
stringData:
  alertmanager.yaml: |-
    # ── WHY THIS FILE HAS RECEIVERS AT ALL (2026-08-04) ───────────────────────────
    # Upstream kube-prometheus ships Default/Watchdog/Critical/null as BARE NAMES with
    # no configuration. That is not a placeholder you can leave alone: it means every
    # one of the 138 alerting rules in manifests/*PrometheusRule.yaml evaluates, fires,
    # reaches Alertmanager — and is silently discarded. Six alerts were firing when this
    # was found, two of them `critical`, and nothing had ever been sent anywhere.
    #
    # The notification path is ntfy (topic yolo-private-cloud-platform, registered in
    # STEP0's ntfy-lib.sh NTFY_TOPICS — ntfy-topic-check.sh [5/5] validates the URLs
    # below against that registry, so renaming the topic in one place fails the gate).
    #
    # WHY THE URLS ARE UNREADABLE. Alertmanager's webhook payload is a FIXED JSON
    # document — unlike Grafana's webhook contact point there is no title/message
    # template to hand it. So the formatting is done on ntfy's side: `?tpl=yes` makes
    # ntfy render Go templates (in t=, m=, p=) against the JSON body it receives.
    # Decoded, both URLs below carry:
    #   t = {{.status | upper}}: {{len .alerts}} platform alert(s)
    #   m = {{range .alerts}}{{.labels.alertname}} ({{.labels.severity}})
    #       {{if .labels.namespace}} ns={{.labels.namespace}}{{end}}
    #       {{if .annotations.description}}{{.annotations.description}}
    #        {{else}}{{.annotations.summary}}{{end}}{{end}}
    #   p = 2 when resolved, else 3 (Default) / 5 = urgent (Critical)
    #
    # DESCRIPTION, NOT SUMMARY, is the body. Upstream kube-prometheus puts the generic
    # sentence in `summary` ("Job failed to complete.") and the IDENTITY of the failing
    # object in `description` ("Job yolo/deploy-health-29763190 failed to complete...").
    # Rendering from `summary` made three simultaneous KubeJobFailed alerts completely
    # indistinguishable from one another, which is useless on a phone — observed on the
    # first real delivery. Falls back to summary for any rule that has no description.
    #
    # Verified by POSTing synthetic Alertmanager payloads before this was applied:
    # title "FIRING: 2 platform alert(s)", one identifying line per alert, priority 5;
    # the resolved variant rendered "RESOLVED: 1 platform alert(s)" at priority 2.
    #
    # ASCII ONLY in those templates. The rendered title becomes a notification header
    # and headers are latin1 — the BUG-CANARY-NTFY-EM-DASH failure in STEP0's
    # ntfy-lib.sh was exactly this, and it throws BEFORE the request is sent.
    "global":
      "resolve_timeout": "5m"
    "inhibit_rules":
    - "equal":
      - "namespace"
      - "alertname"
      "source_matchers":
      - "severity = critical"
      "target_matchers":
      - "severity =~ warning|info"
    - "equal":
      - "namespace"
      - "alertname"
      "source_matchers":
      - "severity = warning"
      "target_matchers":
      - "severity = info"
    - "equal":
      - "namespace"
      "source_matchers":
      - "alertname = InfoInhibitor"
      "target_matchers":
      - "severity = info"
    "receivers":
    - "name": "Default"
      "webhook_configs":
      # max_alerts caps the fan-out so a storm pages once rather than 200 times.
      # An INTEGER here (Alertmanager's own type) — the quoted-string workaround in
      # yolo's Grafana contact point is a Grafana 9.x quirk and does NOT apply.
      - "url": "https://ntfy.sh/yolo-private-cloud-platform?tpl=yes&t=%7B%7B.status%20%7C%20upper%7D%7D%3A%20%7B%7Blen%20.alerts%7D%7D%20platform%20alert%28s%29&m=%7B%7Brange%20.alerts%7D%7D%7B%7B.labels.alertname%7D%7D%20%28%7B%7B.labels.severity%7D%7D%29%7B%7Bif%20.labels.namespace%7D%7D%20ns%3D%7B%7B.labels.namespace%7D%7D%7B%7Bend%7D%7D%0A%7B%7Bif%20.annotations.description%7D%7D%7B%7B.annotations.description%7D%7D%7B%7Belse%7D%7D%7B%7B.annotations.summary%7D%7D%7B%7Bend%7D%7D%0A%0A%7B%7Bend%7D%7D&p=%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7D2%7B%7Belse%7D%7D3%7B%7Bend%7D%7D"
        "max_alerts": 5
        "send_resolved": true
    # Watchdog is DELIBERATELY still a no-op. The rule fires continuously and forever by
    # design; forwarding it would push a notification every repeat_interval for a healthy
    # cluster, which is how a channel gets muted. Its value is the INVERSE: STEP0's
    # alerting-pipeline-watch.sh cron asserts this alert is present and firing, so the
    # absence of Watchdog is what proves the rule pipeline has stopped evaluating. That
    # check runs OUTSIDE the cluster precisely so it still speaks when this whole stack is
    # the thing that died — do not "fix" this by pointing it at ntfy.
    - "name": "Watchdog"
    - "name": "Critical"
      "webhook_configs":
      - "url": "https://ntfy.sh/yolo-private-cloud-platform?tpl=yes&t=%7B%7B.status%20%7C%20upper%7D%7D%3A%20%7B%7Blen%20.alerts%7D%7D%20platform%20alert%28s%29&m=%7B%7Brange%20.alerts%7D%7D%7B%7B.labels.alertname%7D%7D%20%28%7B%7B.labels.severity%7D%7D%29%7B%7Bif%20.labels.namespace%7D%7D%20ns%3D%7B%7B.labels.namespace%7D%7D%7B%7Bend%7D%7D%0A%7B%7Bif%20.annotations.description%7D%7D%7B%7B.annotations.description%7D%7D%7B%7Belse%7D%7D%7B%7B.annotations.summary%7D%7D%7B%7Bend%7D%7D%0A%0A%7B%7Bend%7D%7D&p=%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7D2%7B%7Belse%7D%7D5%7B%7Bend%7D%7D"
        "max_alerts": 5
        "send_resolved": true
    - "name": "null"
    "route":
      "group_by":
      - "namespace"
      "group_interval": "5m"
      "group_wait": "30s"
      "receiver": "Default"
      "repeat_interval": "12h"
      "routes":
      - "matchers":
        - "alertname = Watchdog"
        "receiver": "Watchdog"
      # ── minikube false positives — MUST stay above the `severity = critical` route ──
      # Routes are first-match-wins, and both of these carry severity=critical, so a
      # later entry would never be reached.
      #
      # kube-scheduler and kube-controller-manager are HEALTHY (both 1/1 Running for
      # 6d+ as kube-system static pods). minikube binds them to 127.0.0.1, so they have
      # no Service, kube-prometheus's ServiceMonitors find no targets, and the rules —
      # which are `absent(up{job=...} == 1)` — fire forever. Deleting the ServiceMonitors
      # makes it WORSE, not better: absent() has even less to match on.
      #
      # The real fix is a minikube restart with
      #   --extra-config=scheduler.bind-address=0.0.0.0
      #   --extra-config=controller-manager.bind-address=0.0.0.0
      # plus Services for both. That needs a cluster restart, so it is deliberately NOT
      # done here; this route suppresses the noise until then. If you ever make them
      # scrapable, DELETE this route or you will have muted two genuine alerts.
      - "matchers":
        - "alertname =~ KubeSchedulerDown|KubeControllerManagerDown"
        "receiver": "null"
      - "matchers":
        - "alertname = InfoInhibitor"
        "receiver": "null"
      # ── the dev box is OPTIONAL equipment — its absence is not an incident ──
      # 10.10.10.2 is a dual-boot workstation scraped over the 10GbE link (see
      # manifests/devbox-scrapeConfig.yaml). It is off, or in Windows, a large part
      # of the time and that is normal. Without this route kube-prometheus's
      # TargetDown fires every time it is not running Ubuntu, which is the fastest
      # way to teach someone to ignore the platform channel.
      #
      # Same reasoning and same `null` receiver as the minikube false positives
      # above, with one important difference: those are components that SHOULD be
      # up and are only unscrapable, whereas this one is genuinely allowed to be
      # down. Nothing on the platform depends on it.
      #
      # Scoped to job="devbox" (set by a relabeling in the ScrapeConfig) so it
      # suppresses ONLY this target — a real TargetDown anywhere else still pages.
      # If the dev box ever becomes always-on and you want to hear about it,
      # delete this route.
      - "matchers":
        - "alertname = TargetDown"
        - "job = devbox"
        "receiver": "null"
      - "matchers":
        - "severity = critical"
        "receiver": "Critical"
type: Opaque
